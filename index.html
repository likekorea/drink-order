<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 음료 주문</title>
<style>
  :root{
    --bg:#EEF2EE;
    --surface:#FFFFFF;
    --line:#DCE3DD;
    --text:#20302A;
    --muted:#5C6B63;
    --brand:#3F6B54;
    --brand-dark:#2E4F3E;
    --amber:#B9752F;
    --amber-dark:#96591E;
    --done-bg:#EAF3EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:28px 16px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-0.02em;}
  .date-line{color:var(--muted);font-size:14px;margin:0;}
  #statusBtn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--brand-dark);
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  #statusBtn:hover{background:var(--done-bg);}

  .board{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .row{
    display:grid;
    grid-template-columns:88px 1fr 64px 90px 96px 84px;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row.head{
    background:#F5F8F5;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    padding:10px 16px;
  }
  .name{font-weight:600;font-size:14px;}
  select, input[type=number]{
    width:100%;
    padding:8px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14px;
    background:#fff;
    color:var(--text);
  }
  .price, .total{font-size:14px;color:var(--muted);text-align:right;}
  .total{color:var(--text);font-weight:600;}
  button.order-btn{
    border:none;
    padding:9px 0;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
    background:var(--brand);
    width:100%;
  }
  button.order-btn:hover{background:var(--brand-dark);}
  button.order-btn.done{background:var(--amber);}
  button.order-btn.done:hover{background:var(--amber-dark);}
  .row.done{background:var(--done-bg);}

  #summary{
    margin-top:22px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    display:none;
  }
  #summary h2{font-size:16px;margin:0 0 12px;}
  table.sum-table{width:100%;border-collapse:collapse;font-size:14px;}
  table.sum-table th, table.sum-table td{
    text-align:left;
    padding:8px 6px;
    border-bottom:1px solid var(--line);
  }
  table.sum-table th{color:var(--muted);font-weight:600;font-size:12px;}
  table.sum-table td.num{text-align:right;}
  .grand{font-weight:700;}
  .empty{color:var(--muted);font-size:14px;padding:12px 0;}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;}

  @media (max-width:640px){
    .row{grid-template-columns:1fr;gap:6px;padding:14px 14px;}
    .row.head{display:none;}
    .name{font-size:15px;}
    .price, .total{text-align:left;}
    .row > *{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>오늘의 음료 주문</h1>
      <p class="date-line" id="dateLine"></p>
    </div>
    <button id="statusBtn" type="button">주문현황보기</button>
  </header>

  <div class="board" id="board">
    <div class="row head">
      <div>이름</div><div>메뉴</div><div>수량</div><div>단가</div><div>총액</div><div>주문</div>
    </div>
    <!-- 팀원별 행이 여기 채워집니다 -->
  </div>
  <p class="hint" id="loadHint">불러오는 중...</p>

  <div id="summary">
    <h2>오늘 주문 현황 <span id="sumDate"></span></h2>
    <div id="sumBody"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const board = document.getElementById('board');
const loadHint = document.getElementById('loadHint');
const dateLine = document.getElementById('dateLine');
const summaryBox = document.getElementById('summary');
const sumBody = document.getElementById('sumBody');
const sumDate = document.getElementById('sumDate');
const statusBtn = document.getElementById('statusBtn');

let members = [];
let menu = [];      // [{name, price}]
let todayOrders = {}; // { 이름: {menu, qty, price} }

function todayString(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

async function loadTextFile(path){
  const res = await fetch(path, {cache:'no-store'});
  if(!res.ok) throw new Error(path + ' 을(를) 불러올 수 없습니다.');
  return await res.text();
}

function parseMembers(text){
  return text.split(',').map(s=>s.trim()).filter(Boolean);
}

function parseMenu(text){
  return text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const [name, price] = line.split(',').map(s=>s.trim());
    return {name, price:Number(price)||0};
  });
}

async function fetchTodayOrders(){
  if(!API_URL || API_URL.includes('여기에')){
    return {};
  }
  try{
    const res = await fetch(`${API_URL}?action=list`, {cache:'no-store'});
    const data = await res.json();
    const map = {};
    (data.orders||[]).forEach(o=>{
      map[o.member] = {menu:o.menu, qty:Number(o.qty), price:Number(o.price)};
    });
    return map;
  }catch(err){
    console.error('주문현황 조회 실패', err);
    return {};
  }
}

function buildMenuOptions(select, currentMenuName){
  select.innerHTML = '<option value="">메뉴 선택</option>' +
    menu.map(m=>`<option value="${m.name}" data-price="${m.price}" ${m.name===currentMenuName?'selected':''}>${m.name} (${m.price.toLocaleString()}원)</option>`).join('');
}

function renderBoard(){
  // 기존 행 제거 (헤더 제외)
  [...board.querySelectorAll('.row:not(.head)')].forEach(el=>el.remove());

  members.forEach(name=>{
    const existing = todayOrders[name];
    const row = document.createElement('div');
    row.className = 'row' + (existing ? ' done' : '');
    row.dataset.member = name;

    row.innerHTML = `
      <div class="name">${name}</div>
      <div><select class="menu-select"></select></div>
      <div><input type="number" class="qty-input" min="1" value="${existing?existing.qty:1}"></div>
      <div class="price">-</div>
      <div class="total">-</div>
      <div><button type="button" class="order-btn">${existing?'수정':'주문'}</button></div>
    `;
    board.appendChild(row);

    const select = row.querySelector('.menu-select');
    buildMenuOptions(select, existing ? existing.menu : '');
    updateRowCalc(row);

    select.addEventListener('change', ()=>updateRowCalc(row));
    row.querySelector('.qty-input').addEventListener('input', ()=>updateRowCalc(row));
    row.querySelector('.order-btn').addEventListener('click', ()=>submitOrder(row, name));
  });
}

function updateRowCalc(row){
  const select = row.querySelector('.menu-select');
  const opt = select.selectedOptions[0];
  const price = opt && opt.dataset.price ? Number(opt.dataset.price) : 0;
  const qty = Number(row.querySelector('.qty-input').value) || 0;
  row.querySelector('.price').textContent = price ? price.toLocaleString()+'원' : '-';
  row.querySelector('.total').textContent = price ? (price*qty).toLocaleString()+'원' : '-';
}

async function submitOrder(row, member){
  const select = row.querySelector('.menu-select');
  const opt = select.selectedOptions[0];
  if(!opt || !opt.value){
    alert('메뉴를 선택해 주세요.');
    return;
  }
  const price = Number(opt.dataset.price)||0;
  const qty = Number(row.querySelector('.qty-input').value)||1;
  const btn = row.querySelector('.order-btn');

  if(!API_URL || API_URL.includes('여기에')){
    alert('config.js 에 배포된 웹 앱 주소(API_URL)를 먼저 설정해 주세요.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '저장 중...';
  try{
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({member, menu:opt.value, qty, price})
    });
    todayOrders[member] = {menu:opt.value, qty, price};
    row.classList.add('done');
    btn.textContent = '수정';
  }catch(err){
    console.error(err);
    alert('주문 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    btn.textContent = todayOrders[member] ? '수정' : '주문';
  }finally{
    btn.disabled = false;
  }
}

async function showSummary(){
  const willShow = summaryBox.style.display !== 'block';
  if(!willShow){
    summaryBox.style.display = 'none';
    statusBtn.textContent = '주문현황보기';
    return;
  }
  statusBtn.textContent = '숨기기';
  summaryBox.style.display = 'block';
  sumDate.textContent = '('+todayString()+')';
  sumBody.innerHTML = '<p class="empty">불러오는 중...</p>';

  const latest = await fetchTodayOrders();
  todayOrders = latest;

  const rows = Object.entries(latest);
  if(rows.length === 0){
    sumBody.innerHTML = '<p class="empty">아직 주문한 팀원이 없습니다.</p>';
    return;
  }
  let grand = 0;
  const trs = rows.map(([member, o])=>{
    const total = o.qty * o.price;
    grand += total;
    return `<tr><td>${member}</td><td>${o.menu}</td><td class="num">${o.qty}</td><td class="num">${o.price.toLocaleString()}원</td><td class="num">${total.toLocaleString()}원</td></tr>`;
  }).join('');

  sumBody.innerHTML = `
    <table class="sum-table">
      <thead><tr><th>주문자</th><th>메뉴</th><th class="num">수량</th><th class="num">단가</th><th class="num">총액</th></tr></thead>
      <tbody>${trs}</tbody>
      <tfoot><tr class="grand"><td colspan="4">합계</td><td class="num">${grand.toLocaleString()}원</td></tr></tfoot>
    </table>`;
}

statusBtn.addEventListener('click', showSummary);

(async function init(){
  dateLine.textContent = todayString() + ' 기준';
  try{
    const [membersText, menuText] = await Promise.all([
      loadTextFile('members.txt'),
      loadTextFile('menu.txt')
    ]);
    members = parseMembers(membersText);
    menu = parseMenu(menuText);
    todayOrders = await fetchTodayOrders();
    renderBoard();
    loadHint.style.display = 'none';
  }catch(err){
    console.error(err);
    loadHint.textContent = '불러오기 실패: ' + err.message;
  }
})();
</script>
</body>
</html>
