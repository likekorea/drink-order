<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tea Time 음료 주문 - 해외견적</title>
<style>
  :root{
    --bg:#EEF2EE;
    --surface:#FFFFFF;
    --line:#DCE3DD;
    --text:#20302A;
    --muted:#5C6B63;
    --brand:#3F6B54;
    --brand-dark:#2E4F3E;
    --amber:#B9752F;
    --amber-dark:#96591E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:28px 16px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .title-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  h1{font-size:21px;margin:0;letter-spacing:-0.02em;}
  .brand-logo{height:26px;width:auto;object-fit:contain;display:block;}
  .date-line{color:var(--muted);font-size:14px;margin:4px 0 0;}
  #statusBtn{
    background:#3F5B7A;
    border:none;
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  #statusBtn:hover{background:#31465F;}

  .board{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .row{
    display:grid;
    grid-template-columns:96px 1fr 96px 88px;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row.head{
    background:#F5F8F5;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    padding:10px 16px;
  }
  .name{font-weight:600;font-size:14px;}
  select{
    width:100%;
    padding:8px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14px;
    background:#fff;
    color:var(--text);
  }
  .total{font-size:14px;color:var(--text);font-weight:600;text-align:right;}
  button.order-btn{
    border:none;
    padding:9px 0;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
    background:var(--brand);
    width:100%;
  }
  button.order-btn:hover{background:var(--brand-dark);}
  button.order-btn.done{background:var(--amber);}
  button.order-btn.done:hover{background:var(--amber-dark);}

  .hint{color:var(--muted);font-size:12px;margin-top:10px;}

  .bottom-bar{
    margin-top:24px;
    display:flex;
    justify-content:center;
  }
  #exitBtn{
    background:var(--surface);
    border:1px solid var(--line);
    color:#8A3B3B;
    padding:11px 28px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  #exitBtn:hover{background:#FBEFEF;}

  .exit-screen{
    max-width:480px;
    margin:80px auto 0;
    text-align:center;
    font-size:16px;
    color:var(--text);
    line-height:1.7;
  }

  @media (max-width:640px){
    .row{grid-template-columns:1fr;gap:6px;padding:14px 14px;}
    .row.head{display:none;}
    .name{font-size:15px;}
    .total{text-align:left;}
    .row > *{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap" id="pageBody">
  <header>
    <div>
      <div class="title-line">
        <h1>Tea Time 음료 주문 - 해외견적</h1>
        <img src="logo.png" alt="브랜드 로고" class="brand-logo" onerror="this.style.display='none'">
      </div>
      <p class="date-line" id="dateLine"></p>
    </div>
    <button id="statusBtn" type="button">주문현황보기</button>
  </header>

  <div class="board" id="board">
    <div class="row head">
      <div>이름</div><div>메뉴</div><div>총액</div><div>주문</div>
    </div>
    <!-- 팀원별 행이 여기 채워집니다 -->
  </div>
  <p class="hint" id="loadHint">불러오는 중...</p>

  <div class="bottom-bar">
    <button id="exitBtn" type="button">종료</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const board = document.getElementById('board');
const loadHint = document.getElementById('loadHint');
const dateLine = document.getElementById('dateLine');
const statusBtn = document.getElementById('statusBtn');
const exitBtn = document.getElementById('exitBtn');
const pageBody = document.getElementById('pageBody');

const ROW_COLORS = ['#FBF0DC','#E3EEFA']; // 홀수행 아이보리 / 짝수행 하늘색
const FIXED_QTY = 1; // 인당 주문 수량은 항상 1개로 고정

let members = [];
let menu = [];      // [{name, price, category, temp}]
let todayOrders = {}; // { 이름: {menu, price} }

function todayString(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

async function loadTextFile(path){
  const res = await fetch(path, {cache:'no-store'});
  if(!res.ok) throw new Error(path + ' 을(를) 불러올 수 없습니다.');
  return await res.text();
}

function parseMembers(text){
  return text.split(',').map(s=>s.trim()).filter(Boolean);
}

function parseMenu(text){
  return text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const [name, price, category, temp] = line.split(',').map(s=>s.trim());
    return {name, price:Number(price)||0, category: category||'기타', temp: temp||''};
  });
}

async function fetchTodayOrders(){
  if(!API_URL || API_URL.includes('여기에')){
    return {};
  }
  try{
    const res = await fetch(`${API_URL}?action=list&_=${Date.now()}`, {cache:'no-store'});
    const data = await res.json();
    const map = {};
    (data.orders||[]).forEach(o=>{
      map[o.member] = {menu:o.menu, price:Number(o.price)};
    });
    return map;
  }catch(err){
    console.error('주문현황 조회 실패', err);
    return {};
  }
}

function buildMenuOptions(select, currentMenuName){
  const order = [];
  const groups = {};
  menu.forEach(m=>{
    if(!groups[m.category]){ groups[m.category]=[]; order.push(m.category); }
    groups[m.category].push(m);
  });

  let html = '<option value="">메뉴 선택</option>';
  order.forEach(cat=>{
    html += `<optgroup label="${cat}">`;
    groups[cat].forEach(m=>{
      const priceLabel = m.price ? `${m.price.toLocaleString()}원` : '0원';
      const tempSuffix = (m.temp && m.temp !== '기타') ? ` · ${m.temp}` : '';
      const selected = m.name === currentMenuName ? 'selected' : '';
      html += `<option value="${m.name}" data-price="${m.price}" ${selected}>${m.name} (${priceLabel})${tempSuffix}</option>`;
    });
    html += `</optgroup>`;
  });
  select.innerHTML = html;
}

function renderBoard(){
  [...board.querySelectorAll('.row:not(.head)')].forEach(el=>el.remove());

  members.forEach((name, idx)=>{
    const existing = todayOrders[name];
    const row = document.createElement('div');
    row.className = 'row';
    row.style.background = ROW_COLORS[idx % ROW_COLORS.length];
    row.dataset.member = name;

    row.innerHTML = `
      <div class="name">${name}</div>
      <div><select class="menu-select"></select></div>
      <div class="total">-</div>
      <div><button type="button" class="order-btn">${existing?'수정':'주문'}</button></div>
    `;
    board.appendChild(row);

    const btn = row.querySelector('.order-btn');
    if(existing) btn.classList.add('done');

    const select = row.querySelector('.menu-select');
    buildMenuOptions(select, existing ? existing.menu : '');
    updateRowCalc(row);

    select.addEventListener('change', ()=>updateRowCalc(row));
    btn.addEventListener('click', ()=>submitOrder(row, name));
  });
}

function updateRowCalc(row){
  const select = row.querySelector('.menu-select');
  const opt = select.selectedOptions[0];
  const hasSelection = !!(opt && opt.value);
  const price = hasSelection ? Number(opt.dataset.price)||0 : null;
  row.querySelector('.total').textContent = hasSelection ? price.toLocaleString()+'원' : '-';
}

async function submitOrder(row, member){
  const select = row.querySelector('.menu-select');
  const opt = select.selectedOptions[0];
  if(!opt || !opt.value){
    alert('메뉴를 선택해 주세요.');
    return;
  }
  const price = Number(opt.dataset.price)||0;
  const btn = row.querySelector('.order-btn');

  if(!API_URL || API_URL.includes('여기에')){
    alert('config.js 에 배포된 웹 앱 주소(API_URL)를 먼저 설정해 주세요.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '저장 중...';
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({member, menu:opt.value, qty:FIXED_QTY, price})
    });
    const text = await res.text();
    let result;
    try{ result = JSON.parse(text); }catch(parseErr){
      throw new Error('서버 응답을 해석할 수 없습니다: ' + text.slice(0,200));
    }
    if(!result || result.result !== 'ok'){
      throw new Error('서버가 저장 실패를 반환했습니다: ' + text.slice(0,200));
    }
    todayOrders[member] = {menu:opt.value, price};
    btn.classList.add('done');
    btn.textContent = '수정';
  }catch(err){
    console.error('주문 저장 오류:', err);
    alert('주문 저장에 실패했습니다.\n' + err.message);
    btn.textContent = todayOrders[member] ? '수정' : '주문';
  }finally{
    btn.disabled = false;
  }
}

function showExitScreen(){
  pageBody.innerHTML = `<div class="exit-screen">오늘 주문을 마쳤습니다.<br>이 창을 닫아주세요.</div>`;
  try{ window.close(); }catch(e){}
}

statusBtn.addEventListener('click', ()=>{
  window.location.href = 'status.html';
});
exitBtn.addEventListener('click', showExitScreen);

(async function init(){
  dateLine.textContent = todayString() + ' 기준';
  try{
    const [membersText, menuText] = await Promise.all([
      loadTextFile('members.txt'),
      loadTextFile('menu.txt')
    ]);
    members = parseMembers(membersText);
    menu = parseMenu(menuText);
    todayOrders = await fetchTodayOrders();
    renderBoard();
    loadHint.style.display = 'none';
  }catch(err){
    console.error(err);
    loadHint.textContent = '불러오기 실패: ' + err.message;
  }
})();
</script>
</body>
</html>
